# ?? Production profile overrides ?????????????????????????????????????????????
# Activate with: -Dspring.profiles.active=prod
# Supply credentials via environment variables ? never hard-code them.

spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect

# In production, use 'validate' to protect against unintentional schema mutations.
# Schema changes should be managed via Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=validate

# Disable H2 console (not relevant in production)
spring.h2.console.enabled=false

# Expose only health probe endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized

