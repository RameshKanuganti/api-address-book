spring.application.name=addressbook
spring.profiles.active=dev

# ?? Datasource (H2 in-memory ? dev/test default) ??????????????????????????????
# Override in production via environment variables or spring.profiles.active=prod
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=test

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 console is DISABLED by default for security.
# Enable only in dev profile: spring.profiles.active=dev
spring.h2.console.enabled=false


# ?? Actuator ? health probes for Kubernetes ???????????????????????????????????
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized

bootui.enabled=OFF
